[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meli-loss-intelligence"
version = "0.1.0"
description = "Independent last-mile loss intelligence proof of concept with synthetic data only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loss_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that require the Docker Compose PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
