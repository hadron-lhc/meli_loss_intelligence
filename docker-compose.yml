services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loss_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loss_app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-loss_intelligence}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-loss_app} -d ${POSTGRES_DB:-loss_intelligence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
